on:
  pull_request:
    branches:
      - dev
    paths:
      - "aws/**"
      - "environment/dev/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform_plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment plan result on PR
        uses: actions/github-script@v7
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Plan Result

            Format check: \`${{ steps.fmt.outcome }}\`
            Init: \`${{ steps.init.outcome }}\`
            Validate: \`${{ steps.validate.outcome }}\`
            Plan: \`${{ steps.plan.outcome }}\`

            <details><summary> Plan Print</summary>

            \`\`\`
            ${ process.env.PLAN }
            \`\`\`

            </details>

            workflow: \`${{ github.workflow }}\` | operator: @${{ github.actor }}`

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1